name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh data", "Refresh jobs", "Refresh gas"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 minutes, off the hour (GitHub's busiest minute): NCDOT incidents (DriveNC) are fetched fresh at every build

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # share-card pictures for every widget (etl/share_shots.mjs needs Node 22's WebSocket)
        with:
          node-version: "22"
      - name: Font for the share-card pictures (Inter, close to the system font on Apple devices)
        run: sudo apt-get install -y --no-install-recommends fonts-inter
      - name: Fetch NCDOT incidents (DriveNC) and build the single-file dashboard
        env:
          DRIVENC_API_KEY: ${{ secrets.DRIVENC_API_KEY }}
          KDASH_CONTACT: ${{ secrets.KDASH_CONTACT }}
        run: python etl/run_all.py incidents site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
